<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Em breve</title>
<script>
/* convites, parceiros, Mercado Pago e o ícone do app instalado vão direto para o app */
(function () {
  try {
    var p = new URLSearchParams(location.search), chaves = ['c', 'rep', 'mp', 'abrir', 'mock', 'g'];
    var instalado = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    if (instalado || chaves.some(function (k) { return p.has(k); })) location.replace('/app/' + location.search + location.hash);
  } catch (e) { }
})();
</script>
<style>
:root{color-scheme:light dark}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:#f4f4f2;color:#2b2b2b;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#161616;color:#e6e6e6}}
h1{font-size:clamp(22px,5vw,32px);font-weight:600;margin:0}
p{margin:10px 0 0;opacity:.7;font-size:clamp(15px,3.6vw,18px)}
</style>
</head>
<body>
<main><h1>Em manutenção</h1><p>Em breve.</p></main>
</body>
</html>
