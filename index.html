<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pelota FC</title>
<meta name="description" content="Pelota FC: o app para organizar a sua pelada. Em breve na App Store e no Google Play.">
<meta name="theme-color" content="#0F4D27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pelota FC">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
/* convites, parceiros, Mercado Pago e o ícone do app instalado vão direto para o app */
(function () {
  try {
    var p = new URLSearchParams(location.search), chaves = ['c', 'rep', 'mp', 'abrir', 'mock', 'g'];
    var instalado = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    if (instalado || chaves.some(function (k) { return p.has(k); })) location.replace('/app/' + location.search + location.hash);
  } catch (e) { }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Saira+Condensed:ital,wght@1,800&display=swap">
<style>
:root{--verde:#1B6A36;--verde-esc:#0F4D27;--amarelo:#F2C12E;--laranja:#F0662A;--papel:#EEF2EB}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--verde-esc);color:#fff;font-family:Figtree,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.tela{min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:repeating-linear-gradient(-55deg,rgba(255,255,255,.05) 0 3px,transparent 3px 26px),radial-gradient(circle at 80% 8%,rgba(242,193,46,.28),transparent 45%),linear-gradient(160deg,#1F7A3F 0%,#135A2D 55%,#0B3A1E 100%)}
.campo{position:absolute;inset:auto 0 0 0;height:60%;pointer-events:none;opacity:.12}
.campo:before{content:"";position:absolute;left:50%;top:0;width:min(70vw,520px);aspect-ratio:1;border:6px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.campo:after{content:"";position:absolute;left:0;right:0;top:0;border-top:6px solid #fff}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px 32px;position:relative;z-index:1}
.marca{font-family:'Saira Condensed','Arial Narrow',Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.9;font-size:clamp(64px,16vw,148px);margin:0;text-shadow:4px 4px 0 rgba(0,0,0,.22);letter-spacing:.01em}
.marca span{color:var(--amarelo)}
.lema{margin:14px 0 0;font-weight:600;letter-spacing:.14em;font-size:clamp(14px,3.4vw,18px);opacity:.9}
.faixa{width:120px;height:7px;margin:28px auto;background:linear-gradient(90deg,var(--amarelo) 0 64%,var(--laranja) 64%)}
h2{font-family:'Saira Condensed','Arial Narrow',Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(30px,7vw,52px);line-height:1;margin:0}
.texto{max-width:30em;margin:14px auto 0;font-size:clamp(16px,3.8vw,19px);line-height:1.5;opacity:.88}
.botao{display:inline-flex;align-items:center;gap:10px;margin-top:32px;padding:16px 30px;border-radius:12px;background:var(--amarelo);color:var(--verde-esc);font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 5px 0 #b98d12;transition:transform .12s,box-shadow .12s}
.botao:hover{transform:translateY(-1px)}
.botao:active{transform:translateY(3px);box-shadow:0 2px 0 #b98d12}
.botao:focus-visible{outline:3px solid #fff;outline-offset:4px}
.lojas{margin-top:22px;font-size:14px;opacity:.75}
footer{position:relative;z-index:1;text-align:center;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font-size:14px;opacity:.8}
footer a{color:#fff}
footer .sep{margin:0 8px;opacity:.6}
</style>
</head>
<body>
<div class="tela">
  <div class="campo" aria-hidden="true"></div>
  <main>
    <h1 class="marca">Pelota <span>FC</span></h1>
    <p class="lema">ORGANIZE SUA PELADA</p>
    <div class="faixa" aria-hidden="true"></div>
    <h2>Em breve nas lojas</h2>
    <p class="texto">O app para quem organiza pelada está chegando à App Store e ao Google Play.</p>
    <a class="botao" href="/app/">Entrar no app <span aria-hidden="true">→</span></a>
    <p class="lojas">Já usa o Pelota FC? Toque em "Entrar no app".</p>
  </main>
  <footer><a href="/termos.html">Termos de uso</a><span class="sep">·</span><a href="/privacidade.html">Política de privacidade</a></footer>
</div>
</body>
</html>
